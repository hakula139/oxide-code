# A replaced function body leaves its parameters unused, which the denied workspace warnings turn
# into a build failure, so cargo-mutants would skip the mutant untested.
additional_cargo_args = ["--config", "build.warnings='warn'"]

# Frontend tests also exercise core code, so each mutant faces every crate's tests.
test_workspace = true

# Fixtures that the `testing` feature compiles outside `cfg(test)`, which is the only test gate
# cargo-mutants recognizes.
exclude_globs = ["**/testing.rs"]
exclude_re = ["\\btesting::"]
