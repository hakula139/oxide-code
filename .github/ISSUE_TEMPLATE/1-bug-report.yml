name: Bug report
description: Report a crash, an error, or behavior that differs from the docs
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/hakula139/oxide-code/issues?q=is%3Aissue) first, and add a reaction to a matching one when you find it.

        Redact OAuth tokens, API keys, `Authorization` headers, and private paths from everything you paste below.

  - type: input
    id: version
    attributes:
      label: ox version
      description: Output of `ox --version`.
      placeholder: ox X.Y.Z
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS and terminal
      description: Operating system, architecture, terminal emulator, and multiplexer if any.
      placeholder: macOS arm64, Ghostty, tmux 3.5
    validations:
      required: true

  - type: dropdown
    id: auth
    attributes:
      label: Authentication
      description: Credential source shown by `/status` in the TUI.
      options:
        - Auth token (ANTHROPIC_AUTH_TOKEN)
        - API key (ANTHROPIC_API_KEY)
        - API key (client.api_key)
        - OAuth (CLAUDE_CODE_OAUTH_TOKEN)
        - OAuth (oxide-code login)
        - OAuth (Claude Code login)
        - Not signed in
    validations:
      required: true

  - type: input
    id: base-url
    attributes:
      label: Base URL
      description: Leave empty for the Anthropic API. Redact private hostnames.
      placeholder: https://gateway.example.com/anthropic

  - type: input
    id: model
    attributes:
      label: Model
      description: Model ID shown by `/status` in the TUI.
      placeholder: claude-opus-5-5

  - type: dropdown
    id: frontend
    attributes:
      label: Frontend
      options:
        - TUI
        - Bare REPL (`--no-tui`)
        - Headless (`-p`)
    validations:
      required: true

  - type: dropdown
    id: permission-mode
    attributes:
      label: Permission mode
      description: >-
        The mode when the problem occurred.
        The status line shows `Mode: plan` or `Mode: yolo`, and nothing in `manual`.
      options:
        - manual
        - plan
        - yolo
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence of commands, prompts, or keys that triggers the problem.
      placeholder: |
        1. Run `ox` in a git repository
        2. Type `/diff`
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error text. Text is easier to search than a screenshot.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        The relevant lines from `$XDG_STATE_HOME/ox/log/oxide-code.log`
        (default `~/.local/state/ox/log/oxide-code.log`).
        The TUI writes its log there, and the other modes log to stderr.
      render: text
