name: Feature request
description: Propose a new capability or a change to existing behavior
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/hakula139/oxide-code/blob/main/docs/roadmap.md) first. It lists what is planned and what is out of scope for now.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The workflow that is blocked or awkward today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What ox should do, including the command, flag, config key, or UI surface if you have one in mind.
    validations:
      required: true

  - type: textarea
    id: prior-art
    attributes:
      label: Prior art and alternatives
      description: Workarounds you use today, or how other coding agents handle this.
