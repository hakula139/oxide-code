name: Release

on:
  push:
    tags: ['v[0-9]+.*']
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - about.toml
      - LICENSE
      - licenses/**
      - Cargo.lock
      - Cargo.toml
      - crates/*/Cargo.toml
      - rust-toolchain.toml
      - docs/guide/install.md
  workflow_dispatch:
    inputs:
      notes:
        description: >-
          Tag whose release notes to republish from this ref's CHANGELOG.md, building
          nothing (leave empty to build and check every target)
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    # ci.yml already checks pull requests, and a tag reuses its commit's CI run.
    if: github.event_name != 'pull_request' && github.ref_type != 'tag' && !inputs.notes
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  tagged-ci:
    name: Check Tagged Commit CI
    if: github.ref_type == 'tag' && !inputs.notes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
      - name: Wait for CI on the tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pull request runs test a merge commit, so only push and dispatched runs count.
          while true; do
            verdict=$(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
                --paginate \
                --slurp |
                jq -r '[.[].workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")]
                  | if any(.[]; .conclusion == "success") then
                      "passed \(map(select(.conclusion == "success"))[0].html_url)"
                    elif any(.[]; .status != "completed") then "running"
                    else "failed" end'
            )
            case "$verdict" in
              passed*)
                echo "CI passed on $GITHUB_SHA: ${verdict#passed }"
                exit 0
                ;;
              running)
                sleep 30
                ;;
              *)
                echo "::error::No push or dispatched CI run passed on $GITHUB_SHA." \
                  "Rerun its failed jobs, or run ci.yml on $GITHUB_REF_NAME, then rerun this job."
                exit 1
                ;;
            esac
          done

  build:
    name: Build (${{ matrix.target }})
    if: ${{ !inputs.notes }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # The macOS floor in docs/guide/install.md. Other targets ignore it.
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install

      - name: Install cargo-about
        uses: taiki-e/install-action@cargo-about

      - name: Generate third-party notices
        shell: bash
        run: |
          cargo about generate \
            --locked \
            --manifest-path crates/ox/Cargo.toml \
            --target "${{ matrix.target }}" \
            --name about licenses \
            -o THIRD-PARTY-NOTICES

      - name: Build archive
        id: binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ox
          include: LICENSE,THIRD-PARTY-NOTICES
          archive: oxide-code-$target
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          checksum: sha256
          locked: true
          dry-run: true
          dry-run-intended: true

      - name: Check archive
        shell: bash
        env:
          ARCHIVE: ${{ steps.binary.outputs.tar || steps.binary.outputs.zip }}
        run: |
          mkdir smoke
          if [[ "$ARCHIVE" == *.zip ]]; then
            7z x -o"smoke" "$ARCHIVE" > /dev/null
          else
            tar -xzf "$ARCHIVE" -C smoke
          fi

          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            expected=${GITHUB_REF_NAME#v}
          else
            expected=$(
              cargo metadata --no-deps --format-version 1 |
                jq -r '.packages[] | select(.name == "ox") | .version'
            )
          fi
          test "$(smoke/ox --version)" = "ox $expected"

      - name: Check glibc floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          floor=$(grep -oP 'Linux with glibc \K[0-9.]+(?= or later)' docs/guide/install.md)
          # The loader tolerates a missing weak version, so only `Flags: none` versions are needed.
          required=$(
            readelf -V --wide smoke/ox |
              grep -oP 'Name: GLIBC_\K[0-9.]+(?=\s+Flags: none)' |
              sort -uV |
              tail -1
          )
          test -n "$required"
          echo "ox requires glibc $required, and docs/guide/install.md promises $floor"
          if [[ "$(printf '%s\n' "$required" "$floor" | sort -V | tail -1)" != "$floor" ]]; then
            echo "::error::ox needs glibc $required." \
              "Raise the floor in docs/guide/install.md, or pin the previous runner image."
            exit 1
          fi

      - name: Check macOS floor
        if: runner.os == 'macOS'
        shell: bash
        run: |
          floor=$(sed -nE 's/^- \*\*macOS\*\*: ([0-9.]+) or later.*/\1/p' docs/guide/install.md)
          minos=$(otool -l smoke/ox | awk '$1 == "minos" { print $2 }')
          test -n "$floor"
          test -n "$minos"
          echo "ox targets macOS $minos, and docs/guide/install.md promises $floor"
          if [[ "${minos%.0}" != "${floor%.0}" ]]; then
            echo "::error::ox targets macOS $minos." \
              "Set MACOSX_DEPLOYMENT_TARGET to the floor in docs/guide/install.md."
            exit 1
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: oxide-code-${{ matrix.target }}
          path: |
            ${{ steps.binary.outputs.tar }}
            ${{ steps.binary.outputs.zip }}
            ${{ steps.binary.outputs.sha256 }}
          if-no-files-found: error
          overwrite: true

  nix:
    name: Pin Nix packages
    if: github.ref_type == 'tag' && !inputs.notes
    needs: tagged-ci
    uses: ./.github/workflows/nix-cache.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [tagged-ci, build, nix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: oxide-code-*
          path: release-assets
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip

      - name: Install changelog parser
        uses: taiki-e/install-action@parse-changelog

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          parse-changelog CHANGELOG.md "${GITHUB_REF_NAME#v}" > release-notes.md

          options=(--verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            options+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            release-assets/oxide-code-x86_64-unknown-linux-gnu.tar.gz \
            release-assets/oxide-code-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            release-assets/oxide-code-aarch64-apple-darwin.tar.gz \
            release-assets/oxide-code-aarch64-apple-darwin.tar.gz.sha256 \
            release-assets/oxide-code-x86_64-pc-windows-msvc.zip \
            release-assets/oxide-code-x86_64-pc-windows-msvc.zip.sha256 \
            "${options[@]}"

  formula:
    name: Check Homebrew Formula
    if: github.ref_type == 'tag'
    needs: publish
    uses: ./.github/workflows/formula.yml
    with:
      tag: ${{ github.ref_name }}

  homebrew:
    name: Update Homebrew Formula
    needs: [publish, formula]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download formula
        uses: actions/download-artifact@v8
        with:
          name: formula
          path: Formula

      - name: Open formula PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Follow the latest release, or the newest prerelease before the first stable one.
          latest=$(
            gh api graphql \
              -F owner='{owner}' \
              -F name='{repo}' \
              -f query="query(\$owner: String!, \$name: String!) {
                repository(owner: \$owner, name: \$name) {
                  latestRelease { tagName }
                }
              }" \
              --jq '.data.repository.latestRelease.tagName // empty'
          )

          if [[ -z "$latest" ]]; then
            latest=$(
              gh release list \
                --exclude-drafts \
                --limit 1 \
                --json tagName \
                --jq '.[0].tagName // empty'
            )
          fi

          if [[ -z "$latest" ]]; then
            echo '::error::No published release found for the Homebrew formula'
            exit 1
          fi
          if [[ "$latest" != "$GITHUB_REF_NAME" ]]; then
            echo "Skipping $GITHUB_REF_NAME, since the formula follows $latest."
            exit 0
          fi

          branch="chore/homebrew-$GITHUB_REF_NAME"
          title="chore(release): refresh Homebrew formula for $GITHUB_REF_NAME"
          git switch -c "$branch"
          if git diff --quiet; then
            echo "The formula on main already points at $GITHUB_REF_NAME."
            exit 0
          fi

          git \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -am "$title"
          # A rerun rebuilds this commit on the current main and replaces the earlier push.
          git push --force origin "$branch"

          if [[ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]] &&
            ! gh pr create \
              --base main \
              --head "$branch" \
              --title "$title" \
              --assignee hakula139 \
              --label chore \
              --body-file .github/templates/homebrew-formula-pr.md
          then
            echo "::error::Could not open the formula PR." \
              'Enable "Allow GitHub Actions to create and approve pull requests"' \
              'in Settings > Actions > General, then rerun this job.'
            exit 1
          fi

          # GitHub holds CI on a PR opened with GITHUB_TOKEN until approved, so dispatch CI now.
          run_url=$(gh workflow run ci.yml --ref "$branch")
          if [[ -z "$run_url" ]]; then
            echo "::error::The CI dispatch on $branch returned no run."
            exit 1
          fi
          echo "Dispatched CI: $run_url"

  notes:
    name: Republish Release Notes
    if: inputs.notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install changelog parser
        uses: taiki-e/install-action@parse-changelog

      - name: Republish notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.notes }}
        run: |
          parse-changelog CHANGELOG.md "${TAG#v}" > release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md
