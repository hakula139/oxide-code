name: Release

on:
  push:
    tags: ['v[0-9]+.*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.lock
      - Cargo.toml
      - crates/oxide-code/Cargo.toml
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install && rustup target add ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build archive
        id: binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ox
          archive: oxide-code-$target
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          checksum: sha256
          locked: true
          dry-run: true
          dry-run-intended: true

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: oxide-code-${{ matrix.target }}
          path: |
            ${{ steps.binary.outputs.tar }}
            ${{ steps.binary.outputs.zip }}
            ${{ steps.binary.outputs.sha256 }}
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: oxide-code-*
          path: release-assets
          merge-multiple: true

      - name: Check version
        run: |
          tar -xzf release-assets/oxide-code-x86_64-unknown-linux-gnu.tar.gz ox
          test "$(./ox --version)" = "ox ${GITHUB_REF_NAME#v}"

      - name: Install changelog parser
        uses: taiki-e/install-action@parse-changelog

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          parse-changelog CHANGELOG.md "${GITHUB_REF_NAME#v}" > release-notes.md

          options=(--verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            options+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" release-assets/* "${options[@]}"
