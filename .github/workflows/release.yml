name: Release

on:
  push:
    tags: ['v[0-9]+.*']
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - about.toml
      - LICENSE
      - licenses/**
      - Cargo.lock
      - Cargo.toml
      - crates/*/Cargo.toml
      - rust-toolchain.toml
      - docs/guide/install.md
  workflow_dispatch:
    inputs:
      notes:
        description: >-
          Tag whose release notes to republish from this ref's CHANGELOG.md, building
          nothing (leave empty to build and check every target)
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    # ci.yml already checks pull requests, and a tag reuses its commit's CI run.
    if: github.event_name != 'pull_request' && github.ref_type != 'tag' && !inputs.notes
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  tagged-ci:
    name: Check Tagged Commit CI
    if: github.ref_type == 'tag' && !inputs.notes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
      - name: Wait for CI on the tagged commit
        uses: hakula139/devkit/.github/actions/tagged-ci@v3

  build:
    name: Build (${{ matrix.target }})
    if: ${{ !inputs.notes }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # The macOS floor in docs/guide/install.md. Other targets ignore it.
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install

      - name: Install cargo-about
        uses: taiki-e/install-action@cargo-about

      - name: Generate third-party notices
        shell: bash
        run: |
          cargo about generate \
            --locked \
            --manifest-path crates/ox/Cargo.toml \
            --target "${{ matrix.target }}" \
            --name about licenses \
            -o THIRD-PARTY-NOTICES

      - name: Build archive
        id: binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ox
          include: LICENSE,THIRD-PARTY-NOTICES
          archive: oxide-code-$target
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          checksum: sha256
          locked: true
          dry-run: true
          dry-run-intended: true

      - name: Check archive
        shell: bash
        env:
          ARCHIVE: ${{ steps.binary.outputs.tar || steps.binary.outputs.zip }}
        run: |
          mkdir smoke
          if [[ "$ARCHIVE" == *.zip ]]; then
            7z x -o"smoke" "$ARCHIVE" > /dev/null
          else
            tar -xzf "$ARCHIVE" -C smoke
          fi

          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            expected=${GITHUB_REF_NAME#v}
          else
            expected=$(
              cargo metadata --no-deps --format-version 1 |
                jq -r '.packages[] | select(.name == "ox") | .version'
            )
          fi
          test "$(smoke/ox --version)" = "ox $expected"

      - name: Check glibc floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          floor=$(grep -oP 'Linux with glibc \K[0-9.]+(?= or later)' docs/guide/install.md)
          # The loader tolerates a missing weak version, so only `Flags: none` versions are needed.
          required=$(
            readelf -V --wide smoke/ox |
              grep -oP 'Name: GLIBC_\K[0-9.]+(?=\s+Flags: none)' |
              sort -uV |
              tail -1
          )
          test -n "$required"
          echo "ox requires glibc $required, and docs/guide/install.md promises $floor"
          if [[ "$(printf '%s\n' "$required" "$floor" | sort -V | tail -1)" != "$floor" ]]; then
            echo "::error::ox needs glibc $required." \
              "Raise the floor in docs/guide/install.md, or pin the previous runner image."
            exit 1
          fi

      - name: Check macOS floor
        if: runner.os == 'macOS'
        shell: bash
        run: |
          floor=$(sed -nE 's/^- \*\*macOS\*\*: ([0-9.]+) or later.*/\1/p' docs/guide/install.md)
          minos=$(otool -l smoke/ox | awk '$1 == "minos" { print $2 }')
          test -n "$floor"
          test -n "$minos"
          echo "ox targets macOS $minos, and docs/guide/install.md promises $floor"
          if [[ "${minos%.0}" != "${floor%.0}" ]]; then
            echo "::error::ox targets macOS $minos." \
              "Set MACOSX_DEPLOYMENT_TARGET to the floor in docs/guide/install.md."
            exit 1
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: oxide-code-${{ matrix.target }}
          path: |
            ${{ steps.binary.outputs.tar }}
            ${{ steps.binary.outputs.zip }}
            ${{ steps.binary.outputs.sha256 }}
          if-no-files-found: error
          overwrite: true

  nix:
    name: Pin Nix packages
    if: github.ref_type == 'tag' && !inputs.notes
    needs: tagged-ci
    uses: hakula139/devkit/.github/workflows/nix-cache.yml@v3
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [tagged-ci, build, nix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: oxide-code-*
          path: release-assets
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip

      - name: Publish release
        uses: hakula139/devkit/.github/actions/publish-release@v3
        with:
          assets: |
            release-assets/oxide-code-x86_64-unknown-linux-gnu.tar.gz
            release-assets/oxide-code-x86_64-unknown-linux-gnu.sha256
            release-assets/oxide-code-aarch64-apple-darwin.tar.gz
            release-assets/oxide-code-aarch64-apple-darwin.sha256
            release-assets/oxide-code-x86_64-pc-windows-msvc.zip
            release-assets/oxide-code-x86_64-pc-windows-msvc.sha256

  formula:
    name: Check Homebrew Formula
    if: github.ref_type == 'tag'
    needs: publish
    uses: ./.github/workflows/formula.yml
    with:
      tag: ${{ github.ref_name }}

  homebrew:
    name: Update Homebrew Formula
    needs: [publish, formula]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Download formula
        uses: actions/download-artifact@v8
        with:
          name: formula
          path: ${{ runner.temp }}/formula

      - name: Open formula PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/open-homebrew-pr.sh "$RUNNER_TEMP/formula/oxide-code.rb"

  notes:
    name: Republish Release Notes
    if: inputs.notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install changelog parser
        uses: taiki-e/install-action@parse-changelog

      - name: Republish notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.notes }}
        run: |
          parse-changelog CHANGELOG.md "${TAG#v}" > release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md
