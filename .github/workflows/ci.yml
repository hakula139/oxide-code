name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run flake check
        run: nix flake check

      - name: Format
        if: ${{ !cancelled() }}
        run: nix develop -c pnpm format

      - name: Lint Markdown
        if: ${{ !cancelled() }}
        run: nix develop -c pnpm lint

      - name: Spell check
        if: ${{ !cancelled() }}
        run: nix develop -c pnpm spellcheck

      - name: Check dependencies
        if: ${{ !cancelled() }}
        run: nix develop -c cargo deny --locked check

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
          - os: macOS
            runner: macos-latest
          - os: Windows
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --locked --all-targets

      - name: Clippy without test targets
        if: ${{ !cancelled() }}
        run: cargo clippy --locked

      - name: Rustdoc
        if: ${{ !cancelled() }}
        run: cargo doc --locked --no-deps

      - name: Test with coverage
        id: coverage
        if: ${{ !cancelled() }}
        run: cargo llvm-cov --locked --lcov --output-path lcov.info

      - name: Upload to Codecov
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check
        run: cargo hack check --rust-version --workspace --all-targets --locked

  nix:
    name: Nix (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
          - os: macOS
            runner: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build package
        run: nix build --no-link --print-build-logs

  result:
    name: CI Result
    # A skipped job counts as a passing required check, so the gate must run after failures too.
    if: ${{ !cancelled() }}
    needs: [lint, rust, msrv, nix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check results
        # Unlike the default shell, `bash` sets pipefail, so a failed API call fails the gate.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_ID: ${{ job.check_run_id }}
        run: |
          # `needs` misses a matrix leg cancelled before it starts, so read each job from the API.
          failed=$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --paginate \
              --slurp |
              jq -r --argjson gate "$GATE_ID" '
                [.[].jobs[]] as $jobs
                | first($jobs[] | select(.id == $gate))
                  // error("job \($gate) is missing from this run attempt")
                # A calling workflow's jobs share this run, so check only names with this prefix.
                | (.name | sub("[^/]*$"; "")) as $prefix
                | $jobs[]
                | select(.id != $gate and (.name | startswith($prefix)))
                | select(.conclusion != "success" and .conclusion != "skipped")
                | "::error::\(.name): \(.conclusion // .status)"
              '
          )

          if [[ -n "$failed" ]]; then
            echo "$failed"
            exit 1
          fi
