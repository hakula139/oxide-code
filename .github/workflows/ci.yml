name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  nix:
    uses: hakula139/devkit/.github/workflows/nix.yml@v3
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  rust:
    permissions:
      contents: read
      id-token: write
    uses: hakula139/devkit/.github/workflows/rust.yml@v3
    with:
      msrv: true
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  lint:
    name: Rust Lint Check (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macOS' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [Linux, macOS]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: hakula139/devkit/.github/actions/setup-nix@v3
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cmd-format: nix develop -c {0}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Dev-dependencies turn on ox-core's `testing` feature, so only a build without test targets
      # catches code that compiles only with it.
      - name: Run clippy without test targets
        run: nix develop -c cargo clippy --locked

      - name: Run rustdoc
        if: ${{ !cancelled() }}
        run: nix develop -c cargo doc --locked --no-deps

      - name: Check for unreferenced snapshots
        if: ${{ !cancelled() && matrix.os == 'Linux' }}
        run: nix develop -c cargo insta test --unreferenced=reject

  windows:
    name: Windows Check
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy
        run: cargo clippy --locked --all-targets

      - name: Run clippy without test targets
        if: ${{ !cancelled() }}
        run: cargo clippy --locked

      - name: Run rustdoc
        if: ${{ !cancelled() }}
        run: cargo doc --locked --no-deps

      - name: Run tests
        id: tests
        if: ${{ !cancelled() }}
        run: cargo llvm-cov --locked --lcov --output-path lcov.info

      - name: Upload to Codecov
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          use_oidc: true

  dependencies:
    name: Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: hakula139/devkit/.github/actions/setup-nix@v3
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check dependencies
        run: nix develop .#lint -c cargo deny --locked check

  result:
    name: CI Result
    # A skipped job counts as a passing required check, so the gate must run after failures too.
    if: ${{ !cancelled() }}
    needs: [nix, rust, lint, windows, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read

    steps:
      - name: Check results
        uses: hakula139/devkit/.github/actions/ci-result@v3
