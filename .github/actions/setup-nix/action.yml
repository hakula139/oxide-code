name: Set up Nix
description: Install Nix and configure the hakula Cachix substituter

inputs:
  cachix_auth_token:
    description: Upload token for main and maintainer runs (omit for read-only cache access)

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        # `sandbox-fallback = false` fails a build that cannot get a sandbox, which Nix would
        # otherwise run without one.
        extra_nix_config: |
          sandbox = true
          sandbox-fallback = false

    # `continue-on-error` also covers the action's post step, which pushes the job's builds.
    - name: Set up Cachix
      id: cachix
      continue-on-error: true
      uses: cachix/cachix-action@v17
      with:
        name: hakula
        authToken: ${{ inputs.cachix_auth_token }}
        skipPush: >-
          ${{ !inputs.cachix_auth_token ||
          !(github.ref == 'refs/heads/main' || github.actor == 'hakula139') }}

    - name: Report Cachix failure
      if: ${{ steps.cachix.outcome == 'failure' }}
      shell: bash
      run: echo "::warning title=Cachix unavailable::Cachix setup failed, so this job builds without the hakula cache."
