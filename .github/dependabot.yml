# Renovate opens version updates, so `open-pull-requests-limit: 0` leaves Dependabot only security
# updates. Each entry sets its commit type, which Dependabot would otherwise infer from recent
# commits, and its label, which drops the ecosystem label Dependabot adds by default. Only the cargo
# entry uses `fix`, since Rust advisory bumps ship in `ox` and belong under Fixed in the changelog.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix
      include: scope
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
  - package-ecosystem: github-actions
    # `/` covers the workflows, and the glob adds the composite actions they share.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
