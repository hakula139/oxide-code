# Renovate opens version updates, so Dependabot only opens security updates. These entries exist to
# set their labels and commit types. Without them, each security PR gets an ecosystem label such as
# `rust` and a commit type Dependabot infers from recent commits.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # `fix(deps)` titles put Rust advisory bumps in the changelog, which skips `chore`.
    commit-message:
      prefix: fix
      include: scope
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # npm packages are dev tools that never ship in `ox`, so their bumps stay out of the changelog.
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
  - package-ecosystem: github-actions
    # `/` covers the workflows, and the glob adds the composite actions they share.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Actions only run in CI, so their bumps take the `ci` type, which the changelog skips.
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
