# Renovate opens version updates, so Dependabot only opens security updates. These entries exist to
# set their labels and commit types. Without them, each security PR gets an ecosystem label such as
# `rust` and copies the type of the previous Dependabot commit.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # `fix(deps)` titles put Rust advisory bumps in the changelog, which skips `chore`.
    commit-message:
      prefix: fix
      include: scope
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # npm packages are dev tools that never ship in `ox`, so their bumps stay out of the changelog.
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
