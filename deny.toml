[[advisories.ignore]]
id = "RUSTSEC-2025-0141"
reason = "bincode 1.3.3 is unmaintained and unpatched, and the latest syntect, 5.3.0, requires it"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
