# The release targets, plus the Nix and Cargo hosts the install guide supports.
[graph]
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]

[[advisories.ignore]]
id = "RUSTSEC-2025-0141"
reason = "bincode 1.3.3 is unmaintained and unpatched, and the latest syntect, 5.3.0, requires it"

[licenses]
allow = ["Apache-2.0", "BSD-3-Clause", "BSL-1.0", "ISC", "MIT", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
