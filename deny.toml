[advisories]
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is unmaintained without a patched release, and the latest syntect, 5.3.0, still requires it" },
]

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
# Frontend crates, which only `ox` may depend on so that `ox-core` stays frontend-neutral.
deny = [
  { crate = "arboard", wrappers = ["ox"] },
  { crate = "clap", wrappers = ["ox"] },
  { crate = "crossterm", wrappers = ["ox", "ratatui-crossterm"] },
  { crate = "open", wrappers = ["ox"] },
  { crate = "pulldown-cmark", wrappers = ["ox"] },
  { crate = "ratatui", wrappers = ["ox"] },
  { crate = "ratatui-textarea", wrappers = ["ox"] },
  { crate = "syntect", wrappers = ["ox"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
