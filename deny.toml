[advisories]
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "syntect 5.3.0 requires bincode 1.3.3, which has no safe upgrade available" },
]

[licenses]
allow = [
  "Apache-2.0",          # num_threads
  "BSD-3-Clause",        # subtle
  "BSL-1.0",             # xxhash-rust
  "CDLA-Permissive-2.0", # webpki-root-certs
  "ISC",                 # rustls-webpki
  "MIT",                 # syntect
  "Unicode-3.0",         # icu_collections
  "Zlib",                # foldhash
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
