[workspace]
members = ["crates/oxide-code"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.91"
authors = ["Hakula <i@hakula.xyz>"]
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
let_underscore_untyped = "warn"
mod_module_files = "warn"
todo = "warn"
unwrap_used = "warn"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
caseless = "0.2"
clap = { version = "4", features = ["derive"] }
core-foundation = "0.10"
crossterm = { version = "0.29", features = ["event-stream"] }
dunce = "1"
fastrand = "2"
futures = "0.3"
getrandom = "0.4"
globset = "0.4"
ignore = "0.4"
indoc = "2"
insta = { version = "1", features = ["glob"] }
nix = { version = "0.31", default-features = false, features = ["fs"] }
open = "5"
platform-info = "2"
process-wrap = { version = "10", default-features = false, features = [
  "job-object",
  "process-group",
  "tokio1",
] }
pulldown-cmark = "0.13"
ratatui = "0.30"
ratatui-textarea = "0.9.3"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
rustls-webpki = { version = "0.103", default-features = false, features = ["std"] }
same-file = "1"
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
syntect = { version = "5", default-features = false, features = [
  "default-syntaxes",
  "default-themes",
  "regex-onig",
] }
temp-env = { version = "0.3", features = ["async_closure"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = [
  "formatting",
  "local-offset",
  "macros",
  "parsing",
  "serde",
  "serde-well-known",
] }
toml = "1"
tokio = { version = "1", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
] }
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["serde", "v4"] }
winapi-util = "0.1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
wiremock = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
