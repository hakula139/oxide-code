# Catppuccin Frappe, medium variant.
# https://github.com/catppuccin/catppuccin

# Text hierarchy
text = "#c6d0f5"
muted = "#a5adce"
dim = "#949cbb"

# Surfaces
surface = { bg = "reset" }

# Semantic accents
accent = { fg = "#8caaee", bold = true }
user = "#ef9f76"
queued = "#ca9ee6"
assistant = "#babbf1"

# Status indicators
info = "#99d1db"
success = "#a6d189"
warning = "#e5c890"
error = "#e78284"

# Effort gradient
effort_low = "blue"
effort_medium = "cyan"
effort_high = "green"
effort_xhigh = "magenta"
effort_max = "red"

# Code
code = "#81c8be"
inline_code = "#f2d5cf"
syntax_theme = "base16-ocean.dark"

# Diff backgrounds
diff_add = { bg = "#344037" }
diff_del = { bg = "#41323d" }

# Markdown headings
heading_h1 = { fg = "#c6d0f5", bold = true, underlined = true }
heading_h2 = { fg = "#c6d0f5", bold = true }
heading_h3 = { fg = "#c6d0f5", bold = true, italic = true }
heading_minor = { fg = "#c6d0f5", italic = true }

# Markdown body
thinking = { fg = "#949cbb", italic = true }
link = { fg = "#8caaee", underlined = true }
blockquote = "#737994"
list_marker = "#8caaee"

# Markdown chrome
horizontal_rule = "#626880"
table_header = { fg = "#8caaee", bold = true }
table_border = "#626880"

# UI chrome
tool_border = "#737994"
tool_icon = "#8caaee"
border_focused = "#737994"
border_unfocused = "#626880"
separator = "#626880"
selection = { bg = "#494e63" }
