# Catppuccin Latte, light variant.
# https://github.com/catppuccin/catppuccin

# Text hierarchy
text = "#4c4f69"
muted = "#6c6f85"
dim = "#7c7f93"

# Surfaces
surface = { bg = "reset" }

# Semantic accents
accent = { fg = "#1e66f5", bold = true }
user = "#fe640b"
queued = "#8839ef"
assistant = "#7287fd"

# Status indicators
info = "#04a5e5"
success = "#40a02b"
warning = "#df8e1d"
error = "#d20f39"

# Effort gradient
effort_low = "blue"
effort_medium = "cyan"
effort_high = "green"
effort_xhigh = "magenta"
effort_max = "red"

# Code
code = "#179299"
inline_code = "#e64553"
syntax_theme = "InspiredGitHub"

# Diff backgrounds (light pastels for the light variant)
diff_add = { bg = "#c8e4ce" }
diff_del = { bg = "#f0c8d0" }
diff_add_word = { bg = "#add6ad" }
diff_del_word = { bg = "#eaa3b2" }

# Markdown headings
heading_h1 = { fg = "#4c4f69", bold = true, underlined = true }
heading_h2 = { fg = "#4c4f69", bold = true }
heading_h3 = { fg = "#4c4f69", bold = true, italic = true }
heading_minor = { fg = "#4c4f69", italic = true }

# Markdown body
thinking = { fg = "#7c7f93", italic = true }
link = { fg = "#1e66f5", underlined = true }
blockquote = "#9ca0b0"
list_marker = "#1e66f5"

# Markdown chrome
horizontal_rule = "#acb0be"
table_header = { fg = "#1e66f5", bold = true }
table_border = "#acb0be"

# UI chrome
tool_border = "#9ca0b0"
tool_icon = "#1e66f5"
border_focused = "#9ca0b0"
border_unfocused = "#acb0be"
separator = "#acb0be"
selection = { bg = "#dde1e9" }
