# git-cliff configuration
# Reference: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# Tera's `sort` rejects a null key, so unscoped entries render first in their own loop.
body = """

{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif %}
{% if message %}
    ### Highlights

    {{ message | trim }}
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | split(pat="-->") | last | trim | upper_first }}

    {% for commit in commits -%}
        {% if not commit.scope -%}
            - {{ commit.message | upper_first | trim }}
        {% endif -%}
    {% endfor -%}
    {% for commit in commits | filter(attribute="scope") | sort(attribute="scope") -%}
        - _({{ commit.scope }})_ {{ commit.message | upper_first | trim }}
    {% endfor %}
{%- endfor -%}
"""

# Strip per-line indentation from templates so layout above doesn't leak into output.
trim = true

postprocessors = [
  # Collapse the blank-line runs that template control tags leave behind.
  { pattern = '\n{3,}', replace = "\n\n" },
]

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
# Stable release boundaries include all changes from their prereleases.
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
use_branch_tags = true
sort_commits = "oldest"

commit_preprocessors = [
  # Advisory bumps merged as `chore(deps)` before the `fix(deps)` convention.
  # This runs first because the autolink below rewrites `(#N)`.
  { pattern = '^chore\(deps\)(: .* \(#(17|34|94)\))', replace = 'fix(deps)$1' },
  # Backtick inline HTML in subjects so markdown renders it as code.
  # `(^|[^`])` is a lookbehind stand-in (Rust regex lacks one) skipping already-fenced spans.
  { pattern = '(^|[^`])(<\/?[a-zA-Z][^>]*>)', replace = '$1`$2`' },
  # GitHub autolinks `#N` in release notes but not in rendered files.
  { pattern = '\(#([0-9]+)\)', replace = '([#$1](https://github.com/hakula139/oxide-code/pull/$1))' },
  # Early PR titles joined clauses with a spaced em-dash.
  { pattern = ' — ', replace = ': ' },
]

# `<!-- N -->` prefixes (stripped in the body template) order sections by priority.
# First match wins: catch-all `!:` → type prefixes → skips.
# The `chore` skip covers routine `chore(deps)` and `chore(flake)` bumps.
commit_parsers = [
  { message = '^[a-z]+(\([^)]+\))?!:', group = "<!-- 0 -->Breaking changes" },

  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Changed" },
  { message = "^revert", group = "<!-- 4 -->Removed" },

  { message = "^build", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^docs", skip = true },
  { message = "^refactor", skip = true },
  { message = "^style", skip = true },
  { message = "^test", skip = true },
]
